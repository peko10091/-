<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一秒看出同路人！酸菜白肉鍋默契二選一</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #d94827;
            --primary-hover: #b8381b;
            --secondary-color: #f7a072;
            --bg-color: #fdf8f5;
            --card-bg: #ffffff;
            --text-dark: #2c3e50;
            --accent-gold: #f39c12;
            --option-a: #e74c3c;
            --option-b: #3498db;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: 'Segoe UI', Microsoft JhengHei, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hero-banner {
            background: linear-gradient(135deg, #d94827 0%, #f7a072 100%);
            color: white;
            padding: 2.5rem 1rem;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 4px 15px rgba(217, 72, 39, 0.2);
        }

        .card-custom {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            background: var(--card-bg);
            transition: all 0.3s ease;
        }

        .btn-option {
            padding: 1.2rem 1.5rem;
            font-size: 1.1rem;
            border-radius: 15px;
            border: 2px solid #eee;
            background-color: #fff;
            color: var(--text-dark);
            transition: all 0.25s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
            width: 100%;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-option:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn-option.option-a:hover, .btn-option.option-a.selected {
            border-color: var(--option-a);
            background-color: #fdf2f2;
            color: var(--option-a);
        }

        .btn-option.option-b:hover, .btn-option.option-b.selected {
            border-color: var(--option-b);
            background-color: #f0f7fc;
            color: var(--option-b);
        }

        .badge-tag {
            background-color: #fceade;
            color: var(--primary-color);
            font-weight: 600;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.9rem;
        }

        .progress-bar-custom {
            height: 10px;
            border-radius: 10px;
            background-color: var(--primary-color);
        }

        .option-badge {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            flex-shrink: 0;
            margin-right: 12px;
        }

        .option-a .option-badge {
            background-color: var(--option-a);
            color: white;
        }

        .option-b .option-badge {
            background-color: var(--option-b);
            color: white;
        }

        .result-card {
            background: linear-gradient(135deg, #ffffff 0%, #fff6f0 100%);
            border: 3px solid var(--accent-gold);
        }

        .mode-btn {
            border-radius: 15px;
            padding: 1.5rem;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        .mode-btn:hover {
            transform: scale(1.03);
        }

        /* Presenter Mode */
        .presenter-q-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .presenter-option-btn {
            font-size: 1.5rem;
            padding: 1.5rem 2rem;
        }
    </style>
</head>
<body>

    <!-- Header / Hero -->
    <div class="hero-banner text-center mb-4">
        <div class="container">
            <h1 class="fw-bold mb-2"><i class="fa-solid fa-fire-burner me-2"></i>一秒看出同路人！</h1>
            <p class="lead mb-0">11/10 酸菜白肉鍋 Happy Hour 默契大考驗 🍲</p>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container mb-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <!-- Mode Selection -->
                <div id="mode-select-card" class="card card-custom p-4 text-center animate__animated animate__fadeIn">
                    <h3 class="fw-bold mb-3 text-dark">請選擇遊玩模式</h3>
                    <p class="text-muted mb-4">您可以選擇自己測驗，或是做為聚會現場的主持人投影展示！</p>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <button class="btn btn-outline-danger mode-btn w-100 h-100 d-flex flex-column align-items-center justify-content-center" onclick="startQuiz('solo')">
                                <i class="fa-solid fa-user-astronaut fa-3x mb-3"></i>
                                <span>個人測驗模式</span>
                                <small class="text-muted fw-normal mt-2" style="font-size:0.85rem;">做完全部20題，測出你的火鍋靈魂屬性！</small>
                            </button>
                        </div>
                        <div class="col-md-6">
                            <button class="btn btn-outline-warning mode-btn w-100 h-100 d-flex flex-column align-items-center justify-content-center text-dark" onclick="startQuiz('presenter')">
                                <i class="fa-solid fa-tv fa-3x mb-3 text-warning"></i>
                                <span>主持人投影片模式</span>
                                <small class="text-muted fw-normal mt-2" style="font-size:0.85rem;">大字體全螢幕，適合現場出題全場舉手/選邊站！</small>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Quiz Area -->
                <div id="quiz-card" class="card card-custom p-4 d-none animate__animated">
                    <!-- Progress -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span id="group-badge" class="badge-tag">第一組：食材靈魂大拷問</span>
                        <span id="question-count" class="fw-bold text-muted">1 / 20</span>
                    </div>
                    <div class="progress mb-4" style="height: 10px;">
                        <div id="quiz-progress" class="progress-bar progress-bar-custom" role="progressbar" style="width: 5%;"></div>
                    </div>

                    <!-- Question Content -->
                    <div class="text-center my-3">
                        <h2 id="question-text" class="fw-bold text-dark mb-4">題目載入中...</h2>
                    </div>

                    <!-- Options -->
                    <div id="options-container" class="my-3">
                        <!-- Options injected dynamically -->
                    </div>

                    <!-- Controls -->
                    <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                        <button id="btn-prev" class="btn btn-light rounded-pill px-4" onclick="prevQuestion()" disabled>
                            <i class="fa-solid fa-arrow-left me-1"></i> 上一題
                        </button>
                        <button id="btn-next" class="btn btn-danger rounded-pill px-4" onclick="nextQuestion()" disabled>
                            下一題 <i class="fa-solid fa-arrow-right ms-1"></i>
                        </button>
                    </div>
                </div>

                <!-- Result Card (Solo Mode) -->
                <div id="result-card" class="card card-custom result-card p-4 d-none animate__animated animate__zoomIn text-center">
                    <div class="my-3">
                        <span class="badge bg-danger rounded-pill px-3 py-2 fs-6 mb-2">你的火鍋屬性</span>
                        <h1 id="result-title" class="fw-bold text-danger my-3">測驗結果載入中...</h1>
                        <p id="result-desc" class="lead text-dark mb-4 px-3">描述資訊...</p>
                    </div>

                    <div class="p-3 bg-white rounded-4 shadow-sm mb-4 text-start">
                        <h5 class="fw-bold text-dark border-bottom pb-2 mb-3"><i class="fa-solid fa-list-check me-2 text-danger"></i>你的選單快照：</h5>
                        <ul id="result-summary" class="list-unstyled mb-0" style="max-height: 250px; overflow-y: auto;">
                            <!-- Injected JS -->
                        </ul>
                    </div>

                    <div class="d-flex gap-2 justify-content-center">
                        <button class="btn btn-outline-secondary rounded-pill px-4" onclick="restartQuiz()">
                            <i class="fa-solid fa-rotate-left me-1"></i> 重測一次
                        </button>
                        <button class="btn btn-danger rounded-pill px-4" onclick="shareResult()">
                            <i class="fa-solid fa-share-nodes me-1"></i> 分享給同事/閨蜜
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <footer class="text-center py-3 text-muted border-top mt-auto bg-white" style="font-size: 0.85rem;">
        11/10 酸菜白肉鍋 Happy Hour 聚會專用互動頁面 🎉
    </footer>

    <script>
        const quizData = [
            // 第一組
            { group: "第一組：食材靈魂大拷問", question: "芋頭入湯：", optionA: "(A) 絕對不行！芋頭煮爛湯底就毀了（崩潰派）", optionB: "(B) 一定要加！煮到綿密化開才是精髓（擁護派）", tagA: "芋頭仇恨者", tagB: "芋頭狂熱者" },
            { group: "第一組：食材靈魂大拷問", question: "火鍋白肉的肥瘦：", optionA: "(A) 帶皮帶油脂的「五花肉」最香", optionB: "(B) 偏瘦無負擔的「梅花肉/板腱」才耐吃", tagA: "五花肉香爆派", tagB: "清爽瘦肉派" },
            { group: "第一組：食材靈魂大拷問", question: "米血膏/豬血膏的口感：", optionA: "(A) 稍微涮一下，軟中帶Q最好吃", optionB: "(B) 丟在鍋底煮很久，煮到極度軟爛才及格", tagA: "軟Q派", tagB: "極致軟爛派" },
            { group: "第一組：食材靈魂大拷問", question: "主食選擇：", optionA: "(A) 吸飽酸菜湯汁的「冬粉/寬粉」", optionB: "(B) 經典不敗的「白飯」或「泡麵/王子麵」", tagA: "吸汁寬粉派", tagB: "澱粉快樂派" },
            { group: "第一組：食材靈魂大拷問", question: "酸菜白肉鍋的吸汁配角霸主：", optionA: "(A) 川丸子 / 獅子頭（吸滿酸爽湯汁、咬下去肉香爆汁派）", optionB: "(B) 凍豆腐 / 鈴鈴卷（炸豆皮）（吸汁能力極致、一咬滿口湯底派）", tagA: "爆汁川丸子派", tagB: "豆皮凍豆腐派" },

            // 第二組
            { group: "第二組：吃鍋習慣與禮儀", question: "下肉的方式：", optionA: "(A) 優雅派：一片一片夾著涮，熟了立刻吃", optionB: "(B) 豪氣派：整盤直接倒下鍋，煮熟大家分", tagA: "精緻優雅派", tagB: "豪氣澎湃派" },
            { group: "第二組：吃鍋習慣與禮儀", question: "火鍋撈油/泡沫：", optionA: "(A) 強迫症：看到浮油或浮沫就一定要立刻撈乾淨", optionB: "(B) 隨緣派：那是肉汁精華！煮到最後再說", tagA: "撈油強迫症", tagB: "隨緣湯底派" },
            { group: "第二組：吃鍋習慣與禮儀", question: "吃火鍋的順序：", optionA: "(A) 健康派：先煮蔬菜大白菜，再下肉片", optionB: "(B) 肉食派：先涮三輪肉片湯頭才夠香，蔬菜最後放", tagA: "養生蔬菜派", tagB: "重度肉食派" },
            { group: "第二組：吃鍋習慣與禮儀", question: "湯底能不能喝：", optionA: "(A) 開鍋第一碗酸菜湯一定要喝爆！", optionB: "(B) 湯底鈉含量太高/普林高，只涮肉絕不喝湯", tagA: "酸湯控", tagB: "拒喝高普林派" },
            { group: "第二組：吃鍋習慣與禮儀", question: "蛤蜊/蝦子煮熟判定：", optionA: "(A) 開殼/變紅立刻撈起來，追求極致鮮嫩", optionB: "(B) 怕沒熟，多煮 3 分鐘才安心", tagA: "極致鮮嫩派", tagB: "全熟安心派" },

            // 第三組
            { group: "第三組：醬料與飲料神搭配", question: "酸菜白肉鍋的醬料基底：", optionA: "(A) 傳統經典「胡麻醬 / 芝麻醬」派", optionB: "(B) 台式特調「沙茶醬 + 蒜苗/腐乳」派", tagA: "芝麻胡麻派", tagB: "特調沙茶派" },
            { group: "第三組：醬料與飲料神搭配", question: "沾醬加不加香菜：", optionA: "(A) 香菜加滿！沒有香菜這碗醬就沒有靈魂", optionB: "(B) 絕對拒絕！香菜是毀滅食物的惡魔", tagA: "香菜教徒", tagB: "反香菜陣線" },
            { group: "第三組：醬料與飲料神搭配", question: "生蛋黃入醬：", optionA: "(A) 沾醬一定要打一顆生蛋黃（滑順爆表）", optionB: "(B) 怕生蛋腥味或衛生，堅決不加生蛋", tagA: "生蛋黃滑順派", tagB: "熟食堅持派" },
            { group: "第三組：醬料與飲料神搭配", question: "解膩飲料霸主：", optionA: "(A) 涼爽無負擔的「無糖綠茶 / 烏龍茶」", optionB: "(B) 酸甜爽快的「烏梅汁 / 酸梅湯 / 蘋果西打」", tagA: "無糖茶派", tagB: "酸甜氣泡派" },
            { group: "第三組：醬料與飲料神搭配", question: "吃火鍋喝酒派：", optionA: "(A) 暢快解熱的「冰啤酒 / 氣泡酒」", optionB: "(B) 暖胃過癮的「高粱 / 薄酒 / 清酒」", tagA: "冰啤酒派", tagB: "烈酒暖胃派" },

            // 第四組
            { group: "第四組：吃鍋情境與職場趣味", question: "煮火鍋途中加湯：", optionA: "(A) 一定要加「原酸菜湯底」！湯頭變淡就失魂了（濃郁堅持派）", optionB: "(B) 加「高湯/白開水」就好！越煮越濃剛好可以調和（順口剛剛好派）", tagA: "濃郁堅持派", tagB: "調味剛剛好派" },
            { group: "第四組：吃鍋情境與職場趣味", question: "被滾燙火鍋湯汁噴到衣服：", optionA: "(A) 當場崩潰！ 立刻跑去洗手間拿濕紙巾吸水狂擦（完美主義派）", optionB: "(B) 算了啦！ 繼續大口吃肉，這就是吃火鍋的勳章（佛系豪邁派）", tagA: "完美主義派", tagB: "佛系豪邁派" },
            { group: "第四組：吃鍋情境與職場趣味", question: "吃火鍋的環境氛圍：", optionA: "(A) 喜歡熱熱鬧鬧、煙霧繚繞的「圍爐歡樂感」", optionB: "(B) 喜歡一人一鍋、乾淨舒服的「精緻獨享感」", tagA: "熱鬧圍爐派", tagB: "精緻獨享派" },
            { group: "第四組：吃鍋情境與職場趣味", question: "吃到最後的終極收尾：", optionA: "(A) 用剩下的湯底煮「精華雜炊粥」", optionB: "(B) 肚子留給「冰淇淋 / 甜點」做完美句點", tagA: "精華雜炊派", tagB: "甜點胃收尾派" },
            { group: "第四組：吃鍋情境與職場趣味", question: "吃完火鍋的衣服味道：", optionA: "(A) 沒關係，這就是充滿幸福感的火鍋味～", optionB: "(B) 回家立刻把整套衣服拿去洗，受不了火鍋味殘留", tagA: "幸福火鍋香派", tagB: "潔癖洗衣派" }
        ];

        let currentMode = 'solo';
        let currentIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        function startQuiz(mode) {
            currentMode = mode;
            currentIndex = 0;
            userAnswers = new Array(quizData.length).fill(null);

            document.getElementById('mode-select-card').classList.add('d-none');
            const quizCard = document.getElementById('quiz-card');
            quizCard.classList.remove('d-none');
            quizCard.classList.add('animate__fadeIn');

            renderQuestion();
        }

        function renderQuestion() {
            const data = quizData[currentIndex];
            document.getElementById('group-badge').innerText = data.group;
            document.getElementById('question-count').innerText = `${currentIndex + 1} / ${quizData.length}`;
            
            // Progress Bar
            const progressPercent = ((currentIndex + 1) / quizData.length) * 100;
            document.getElementById('quiz-progress').style.width = `${progressPercent}%`;

            // Question Text
            const qEl = document.getElementById('question-text');
            if (currentMode === 'presenter') {
                qEl.className = "fw-bold presenter-q-title my-3";
            } else {
                qEl.className = "fw-bold text-dark mb-4 fs-3";
            }
            qEl.innerText = `${currentIndex + 1}. ${data.question}`;

            // Options Container
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const btnA = document.createElement('button');
            btnA.className = `btn btn-option option-a ${userAnswers[currentIndex] === 'A' ? 'selected' : ''} ${currentMode === 'presenter' ? 'presenter-option-btn' : ''}`;
            btnA.onclick = () => selectOption('A');
            btnA.innerHTML = `<span class="d-flex align-items-center"><span class="option-badge">A</span><span>${data.optionA}</span></span>`;

            const btnB = document.createElement('button');
            btnB.className = `btn btn-option option-b ${userAnswers[currentIndex] === 'B' ? 'selected' : ''} ${currentMode === 'presenter' ? 'presenter-option-btn' : ''}`;
            btnB.onclick = () => selectOption('B');
            btnB.innerHTML = `<span class="d-flex align-items-center"><span class="option-badge">B</span><span>${data.optionB}</span></span>`;

            container.appendChild(btnA);
            container.appendChild(btnB);

            // Button States
            document.getElementById('btn-prev').disabled = (currentIndex === 0);
            const btnNext = document.getElementById('btn-next');
            btnNext.disabled = (userAnswers[currentIndex] === null && currentMode === 'solo');

            if (currentIndex === quizData.length - 1) {
                btnNext.innerHTML = currentMode === 'solo' ? '看測驗結果 <i class="fa-solid fa-trophy ms-1"></i>' : '完成結束 <i class="fa-solid fa-flag-checkered ms-1"></i>';
            } else {
                btnNext.innerHTML = '下一題 <i class="fa-solid fa-arrow-right ms-1"></i>';
            }
        }

        function selectOption(option) {
            userAnswers[currentIndex] = option;
            renderQuestion();

            // Auto-advance in solo mode after small delay
            if (currentMode === 'solo') {
                setTimeout(() => {
                    nextQuestion();
                }, 300);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                if (currentMode === 'solo') {
                    showResult();
                } else {
                    alert("🎉 所有題目展示完成！預祝 11/10 酸菜白肉鍋 Happy Hour 圓滿成功！");
                    restartQuiz();
                }
            }
        }

        function showResult() {
            document.getElementById('quiz-card').classList.add('d-none');
            const resultCard = document.getElementById('result-card');
            resultCard.classList.remove('d-none');

            // Calculate Persona
            let countA = userAnswers.filter(a => a === 'A').length;
            let countB = userAnswers.filter(a => a === 'B').length;

            let title = "";
            let desc = "";

            if (countA >= 14) {
                title = "🔥 豪爽經典酸香派";
                desc = "你是傳統火鍋靈魂的守護者！堅持正宗吃法、追求豪爽熱鬧的圍爐氛圍，對火鍋有著不可撼動的儀式感。跟你吃鍋最暢快！";
            } else if (countB >= 14) {
                title = "✨ 質感特調創意派";
                desc = "你是極具個人風格的饕客！不拘泥於傳統，喜歡特調沾醬與講究的吃鍋順序，注重環境與吃鍋品質。跟你吃鍋總能發現新大陸！";
            } else {
                title = "🍲 百搭隨和美食派";
                desc = "你兼具理性與感性，既能豪氣乾杯又能細細品嚐！不論是芋頭、香菜還是五花肉，你都能隨遇而安，是 Happy Hour 的絕佳神隊友！";
            }

            document.getElementById('result-title').innerText = title;
            document.getElementById('result-desc').innerText = desc;

            // Summary List
            const summaryList = document.getElementById('result-summary');
            summaryList.innerHTML = '';
            quizData.forEach((q, idx) => {
                const ans = userAnswers[idx];
                const choiceText = ans === 'A' ? q.tagA : (ans === 'B' ? q.tagB : '未選擇');
                const badgeClass = ans === 'A' ? 'bg-danger' : 'bg-primary';
                
                const li = document.createElement('li');
                li.className = 'py-1 border-bottom d-flex justify-content-between align-items-center';
                li.innerHTML = `<span><strong>Q${idx+1}. ${q.question}</strong></span> <span class="badge ${badgeClass} rounded-pill">${choiceText}</span>`;
                summaryList.appendChild(li);
            });
        }

        function restartQuiz() {
            document.getElementById('result-card').classList.add('d-none');
            document.getElementById('quiz-card').classList.add('d-none');
            document.getElementById('mode-select-card').classList.remove('d-none');
        }

        function shareResult() {
            if (navigator.share) {
                navigator.share({
                    title: '一秒看出同路人！酸菜白肉鍋默契大考驗',
                    text: `我在 Happy Hour 默契大考驗測出【${document.getElementById('result-title').innerText}】！快來測測看吧！`,
                    url: window.location.href
                }).catch(() => {});
            } else {
                alert("已複製成果資訊！快發到 LINE 群組分享給同事吧 🎉");
            }
        }
    </script>
</body>
</html>
